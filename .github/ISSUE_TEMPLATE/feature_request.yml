name: Feature request
description: Suggest an improvement or a new feature
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you ran into while drafting or using the program.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: markdown
    attributes:
      value: |
        Please note that the program only reads the screen and uses public aggregate hero statistics. Features that show information about other players, read the game's memory, or automate inputs will not be added.
